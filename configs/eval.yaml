defaults:
  - _self_
  - benchmark: hotpotqa
  - agent: expel
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled    

ai_name: ${benchmark.ai_name}
agent_type: ${agent.name}
log_dir: logs
testing: true
resume: false
load_cache_rules: true
no_rules: false
run_name: run
load_run_name: ${run_name}
# Optional: load checkpoint from another path (e.g. insights from math2code_math when evaling math2code)
load_log_path: null
# Optional: benchmark to evaluate on, while `benchmark` provides the trajectories/insights to load.
# e.g. benchmark=math2code_math eval_benchmark=code2math_code => load math insights, eval code tasks.
eval_benchmark: null
# Placeholder correctness for code tasks: 'class_solution' means a completion is correct iff it
# starts with `class Solution` (real testing is done offline later). null => env's official tests.
eval_correctness: null

# remove hydra output files
hydra:  
  output_subdir: null  
  run:  
    dir: .
